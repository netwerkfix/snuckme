<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>snuck.me</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js" integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.0.0-alpha.6/css/bootstrap.min.css" integrity="sha256-rr9hHBQ43H7HSOmmNkxzQGazS/Khx+L8ZRHteEY1tQ4=" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: #d1e0d5;
            color: #2d2828;
        }
        .shell {
            max-width: 760px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }
        .logo {
            display: block;
            width: min(100%, 525px);
            margin: 0 auto 2rem;
        }
        .card {
            padding: 2rem;
            border: 1px solid #6c6b86;
            border-radius: .5rem;
            background: rgba(255, 255, 255, .75);
        }
        #certificate {
            margin-top: 1.5rem;
        }
        #certificate-stats td:first-child {
            font-weight: 600;
            padding-right: 1rem;
            white-space: nowrap;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="shell">
        <img class="logo" src="/title.svg" alt="snuck.me">
        <section class="card">
            <h1 class="h3">Inspect a TLS certificate</h1>
            <p>Enter a hostname or HTTPS URL. The Python service retrieves and displays the remote certificate.</p>
            <div class="input-group">
                <input id="url" class="form-control" type="text" placeholder="example.com" aria-label="Hostname or HTTPS URL">
                <span class="input-group-btn">
                    <button id="query" class="btn btn-primary" type="button">Inspect</button>
                </span>
            </div>
            <div id="certificate" class="alert invisible" role="status">
                <table class="table table-sm mb-0">
                    <tbody id="certificate-stats"></tbody>
                </table>
            </div>
        </section>
        <footer>
            <a href="https://jlospinoso.github.io/node/javascript/security/cryptography/privacy/2017/02/20/snuckme-cert-query.html">About the original snuck.me project</a>
        </footer>
    </main>
    <script src="/client.js"></script>
</body>
</html>
